project:
  type: website
  output-dir: _site
  resources:
    - data/processed/explore_data.json
    - scripts/explore.js

website:
  title: "The Mind–Immunity Connection"
  navbar:
    background: "#102638"
    foreground: "#ffffff"
    collapse: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Explore the Evidence"
        href: explore.qmd
      - text: "When Emotions Become Physical"
        href: story.qmd
      - text: "How We Measured It"
        href: methods.qmd
      - text: "Research & Sources"
        href: sources.qmd
  page-footer:
    left: "An unweighted, descriptive look at NHANES 2017–2018."
    right: "Association is not causation."

format:
  html:
    theme: none
    css: styles.css
    toc: false
    smooth-scroll: true
    anchor-sections: false
    link-external-newwindow: true
    code-fold: false
    include-in-header:
      text: |
        <meta name="viewport" content="width=device-width, initial-scale=1">
execute:
  echo: false
  warning: false
  message: false
  freeze: false
